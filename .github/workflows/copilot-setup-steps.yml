on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: copilot
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Load toolchain versions
      shell: bash
      run: cat .github/rust-toolchain.env >> "$GITHUB_ENV"

    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ env.RUSTFMT_TOOLCHAIN }}
        components: rustfmt

    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
        components: clippy

    - name: Cache Cargo dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: copilot-cargo

    - name: Install cargo-quickinstall
      run: cargo install cargo-quickinstall

    - name: Install Rust MCP Server
      run: cargo quickinstall rust-mcp-server

    - name: Install cargo-unused-deps
      run: cargo +"$RUSTFMT_TOOLCHAIN" install --locked --version "$CARGO_UNUSED_DEPS_VERSION" cargo-unused-deps

    - name: Install cargo-deny
      run: cargo quickinstall cargo-deny
