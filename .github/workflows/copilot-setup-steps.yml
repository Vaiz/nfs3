on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: copilot
    steps:
    - uses: actions/checkout@v7
    - name: Load toolchain versions
      shell: bash
      run: cat .github/rust-toolchain.env >> "$GITHUB_ENV"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUSTFMT_TOOLCHAIN }}
        components: rustfmt

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
        components: clippy

    - name: Cache Cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: copilot-cargo

    - name: Install cargo-quickinstall
      run: cargo install cargo-quickinstall

    - name: Install Rust MCP Server
      run: cargo quickinstall rust-mcp-server

    - name: Install cargo-machete
      run: cargo quickinstall cargo-machete

    - name: Install cargo-deny
      run: cargo quickinstall cargo-deny
