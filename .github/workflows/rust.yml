name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  debug_build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-pc-windows-msvc
          os: windows-latest
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-24.04-arm
        - target: aarch64-apple-darwin
          os: macos-latest

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }} (debug)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Load toolchain versions
      shell: bash
      run: cat .github/rust-toolchain.env >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Build
      run: cargo build --locked --verbose --target ${{ matrix.target }}

    - name: Run tests
      run: cargo test --locked --verbose --all-features --target ${{ matrix.target }}

    - name: Test cargo-nfs3-server
      env:
        NFS3_MIRROR_SERVER: target/${{ matrix.target }}/debug/cargo-nfs3-server${{ runner.os == 'Windows' && '.exe' || '' }}
      run: cargo run -p nfs3_tests --bin test_mirror_fs --locked --target ${{ matrix.target }}

  release_build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64-pc-windows-msvc
          os: windows-latest
        - target: x86_64-unknown-linux-gnu
          os: ubuntu-latest
        - target: aarch64-unknown-linux-gnu
          os: ubuntu-24.04-arm
        - target: aarch64-apple-darwin
          os: macos-latest

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }} (release)

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Load toolchain versions
      shell: bash
      run: cat .github/rust-toolchain.env >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
        targets: ${{ matrix.target }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Build
      run: cargo build --release --locked --verbose --target ${{ matrix.target }}

    - name: Run tests
      run: cargo test --release --locked --verbose --all-features --target ${{ matrix.target }}

    - name: Test cargo-nfs3-server
      env:
        NFS3_MIRROR_SERVER: target/${{ matrix.target }}/release/cargo-nfs3-server${{ runner.os == 'Windows' && '.exe' || '' }}
      run: cargo run --release -p nfs3_tests --bin test_mirror_fs --locked --target ${{ matrix.target }}

  msrv_build:
    runs-on: ubuntu-latest
    name: MSRV Build

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

    - name: Get MSRV
      id: msrv
      shell: pwsh
      run: |
        $msrv = Select-String '^rust-version' Cargo.toml | Select-Object -First 1 | ForEach-Object {
          ($_ -split '"')[1]
        }
        "msrv=$msrv" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Install toolchain
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ steps.msrv.outputs.msrv }}

    - name: Build
      run: cargo +${{ steps.msrv.outputs.msrv }} build --locked --verbose

  code_guidelines:
    runs-on: ubuntu-latest
    name: Code guidelines

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Load toolchain versions
      shell: bash
      run: cat .github/rust-toolchain.env >> "$GITHUB_ENV"

    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ env.RUSTFMT_TOOLCHAIN }}
        components: rustfmt

    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
        components: clippy

    - name: fmt
      run: cargo +"$RUSTFMT_TOOLCHAIN" fmt --check

    - name: clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings

    - name: Install cargo-unused-deps
      run: cargo +"$RUSTFMT_TOOLCHAIN" install --locked --version "$CARGO_UNUSED_DEPS_VERSION" cargo-unused-deps

    - name: Check unused dependencies
      run: cargo +"$RUSTFMT_TOOLCHAIN" unused-deps --workspace

  linelint:
    runs-on: ubuntu-latest
    name: Linelint

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: fernandrone/linelint@7907a5dca0c28ea7dd05c6d8d8cacded713aca11 # 0.0.6
        id: linelint
