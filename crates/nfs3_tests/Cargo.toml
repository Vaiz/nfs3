[package]
name = "nfs3_tests"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false # this crate contains only tests

[features]
rpc-diagnostics = [
    "nfs3_client/rpc-diagnostics",
    "nfs3_server/rpc-diagnostics",
]
allocator-diagnostics = [
    "dep:nfs3_types",
    "nfs3_types/opaque-diagnostics",
    "dep:rallocator",
    "dep:seismograph",
]

[dependencies]
nfs3_client = { workspace = true, features = ["tokio"] }
nfs3_server = { workspace = true, features = ["__test_reexports", "memfs"] }
nfs3_types = { workspace = true, optional = true }
rallocator = { workspace = true, optional = true }
seismograph = { workspace = true, optional = true }

anyhow.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util", "rt-multi-thread"], default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "perf_bench"
harness = false

[[bin]]
name = "opaque_allocator_baseline"
path = "src/bin/opaque_allocator_baseline.rs"
required-features = ["allocator-diagnostics"]

[[bin]]
name = "rpc_allocator_baseline"
path = "src/bin/rpc_allocator_baseline.rs"
required-features = ["allocator-diagnostics", "rpc-diagnostics"]

[[bin]]
name = "rpc_timing"
path = "src/bin/rpc_timing.rs"

[lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"
