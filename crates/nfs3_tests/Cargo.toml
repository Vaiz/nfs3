[package]
name = "nfs3_tests"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
publish = false # this crate contains only tests

[dependencies]
nfs3_client = { workspace = true, features = ["tokio"] }
nfs3_server = { workspace = true, features = ["__test_reexports", "memfs"] }

anyhow.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util", "rt-multi-thread", "net", "time"], default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
criterion = { workspace = true }
metabench.workspace = true

[[bench]]
name = "perf_bench"
harness = false

[[bench]]
name = "rpc_allocations"
harness = false
# Run explicitly with --bench rpc_allocations -- --allocations; Metabench's
# default engines include Gungraun, which needs an external runner on Linux.
bench = false
test = false

[lints]
workspace = true
