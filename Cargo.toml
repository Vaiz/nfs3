[workspace]
members = [
    "crates/*"
]
resolver = "3"

[workspace.package]
authors = ["Vaiz"]
rust-version = "1.95"
edition = "2024"
homepage = "https://github.com/Vaiz/nfs3"
repository = "https://github.com/Vaiz/nfs3"
license = "Unlicense"

[workspace.dependencies]
nfs3_macros = { version = "0.5.1", path = "crates/nfs3_macros" }
nfs3_types = { version = "0.5.3", path = "crates/nfs3_types" }
nfs3_server = { version = "0.11.1", path = "crates/nfs3_server" }
nfs3_client = { version = "0.9.1", path = "crates/nfs3_client" }

anyhow = "1.0.103"
bytes = "1.11"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
clap = { version = "4.5", default-features = false }
ctrlc = { version = "3.5" }
fastrand = "2.3"
filetime = "0.2.25"
future_assert = "0.1.0"
intaglio = "1.13.3"
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
metabench = "0.3.0"
proc-macro2 = "1.0.95"
quote = "1.0.40"
socket2 = "0.6"
smol = "2.0"
syn = "3.0.3"
tokio = { version = "1.53.3", default-features = false }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.20"
tempfile = "3"

# https://microsoft.github.io/rust-guidelines/guidelines/universal/#clippy-lints
[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
nursery = { level = "deny", priority = -1 }

allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

enum_glob_use = "deny"
unwrap_used = "deny"

redundant_pub_crate = "allow"
literal_string_with_formatting_args = "allow"
significant_drop_tightening = "allow" # it's too buggy
missing_errors_doc = "allow"
collapsible_if = "allow"
